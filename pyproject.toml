[project]
name = "lattice"
version = "0.1.0"
description = "A data-oriented, hot-reloading 3D game engine where games are plain Python files."
readme = "README.md"
authors = [
    { name = "Nathan Yearout", email = "nathanyearout@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "glfw>=2.10.2",
    "numpy>=2.5.3",
    "pygfx>=0.17.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
lattice = "lattice:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
